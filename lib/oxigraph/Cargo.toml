[package]
name = "oxigraph"
version.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
keywords = ["RDF", "SPARQL", "graph-database", "database"]
categories = ["database-implementations"]
repository = "https://github.com/oxigraph/oxigraph/tree/main/lib/oxigraph"
homepage = "https://oxigraph.org/"
documentation = "https://docs.rs/oxigraph"
description = "SPARQL database and RDF toolkit"
edition.workspace = true
rust-version.workspace = true
build = "build.rs"

[features]
default = ["rocksdb"]
rocksdb = ["oxrocksdb-sys"]
js = [
  "getrandom/wasm_js",
  "oxsdatatypes/js",
  "js-sys",
  "oxdatalog?/js",
  "oxrdfs?/js",
  "oxowl?/js",
  "oxshacl?/js",
]
http-client = ["oxhttp"]
http-client-native-tls = ["http-client", "oxhttp/native-tls"]
http-client-rustls-webpki = ["http-client", "oxhttp/rustls-ring-webpki"]
http-client-rustls-native = ["http-client", "oxhttp/rustls-ring-native"]
rocksdb-pkg-config = ["oxrocksdb-sys/pkg-config"]
rocksdb-debug = []
rdf-12 = [
  "oxrdfio/rdf-12",
  "spareval/sparql-12",
  "oxdatalog?/rdf-12",
  "oxrdfs?/rdf-12",
  "oxowl?/rdf-12",
  "oxshacl?/rdf-12",
]
geosparql = ["spareval/geosparql"]
datalog = ["dep:oxdatalog"]
# The Oxigraph-facing RDFS API is explicitly the RDF 1.2 finite profile.
# Consumers that need the RDF 1.2 Basic (14-pattern) build can depend on
# `oxrdfs` directly without its `rdf-12` feature.
rdfs = ["dep:oxrdfs", "rdf-12"]
owl2-rl = ["dep:oxowl"]
shacl = ["dep:oxshacl"]
# Native optional full-text provider; standard SPARQL remains independent.
text-index = ["rocksdb", "dep:tantivy"]
spatial-index = ["rocksdb", "dep:spargeo", "dep:rstar"]

[dependencies]
dashmap.workspace = true
oxiri.workspace = true
oxdatalog = { workspace = true, optional = true, features = ["spareval"] }
oxowl = { workspace = true, optional = true }
oxrdf = { workspace = true, features = ["oxsdatatypes", "rdfc-10"] }
oxrdfio.workspace = true
oxrdfs = { workspace = true, optional = true }
oxshacl = { workspace = true, optional = true }
oxsdatatypes.workspace = true
oxstr.workspace = true
rand.workspace = true
rustc-hash.workspace = true
sha2.workspace = true
siphasher.workspace = true
sparesults.workspace = true
spargebra = { workspace = true, features = ["sep-0002", "sep-0006"] }
spareval = { workspace = true, features = [
  "sep-0002",
  "sep-0006",
  "calendar-ext",
] }
thiserror.workspace = true
url.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
libc.workspace = true
oxhttp = { workspace = true, optional = true, features = ["flate2"] }
oxrocksdb-sys = { workspace = true, optional = true }
tantivy = { version = "0.26.1", default-features = false, optional = true }
rstar = { version = "0.13", default-features = false, optional = true }
spargeo = { workspace = true, optional = true }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
getrandom.workspace = true
js-sys = { workspace = true, optional = true }
rand = "0.10"

[dev-dependencies]
serde_json.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
codspeed-criterion-compat.workspace = true
csv.workspace = true
oxhttp = { workspace = true, features = ["rustls-ring-native"] }
bzip2.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[[bench]]
name = "store"
harness = false
required-features = ["rocksdb"]

[[bench]]
name = "transactional_write"
harness = false
required-features = ["rocksdb"]

[[example]]
name = "shacl_commit_gate"
required-features = ["shacl"]

[[example]]
name = "text_index"
required-features = ["text-index"]

[[example]]
name = "text_service"
required-features = ["text-index"]

[[example]]
name = "spatial_index"
required-features = ["spatial-index"]
